[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuck_provider"
version = "0.1.0"
description = "Monitor contínuo da qualidade da internet (ping, jitter, perda, quedas, velocidade e sinal Wi-Fi) que gera evidência para denúncias de serviço mal prestado à Anatel."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
